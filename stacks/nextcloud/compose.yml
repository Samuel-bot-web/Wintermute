services:
  redis:
    image: redis:7
    container_name: nextcloud-redis
    restart: unless-stopped
    volumes:
      - /mnt/nas6tb/nextcloud/redisdata:/data

  db:
    image: postgres:16
    container_name: nextcloud-db
    restart: unless-stopped
    volumes:
      - /mnt/nas6tb/nextcloud/pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

  app:
    image: nextcloud:latest
    container_name: nextcloud
    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped
    depends_on:
      - db
      - redis
    ports:
      - "8020:80"
    volumes:
      - /mnt/nas6tb/nextcloud/html:/var/www/html
      - /mnt/nas6tb/nextcloud/data:/var/www/html/data
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      NEXTCLOUD_ADMIN_USER: "${NEXTCLOUD_ADMIN_USER}"
      NEXTCLOUD_ADMIN_PASSWORD: "${NEXTCLOUD_ADMIN_PASSWORD}"
      NEXTCLOUD_TRUSTED_DOMAINS: "${NEXTCLOUD_TRUSTED_DOMAINS}"
      REDIS_HOST: redis
