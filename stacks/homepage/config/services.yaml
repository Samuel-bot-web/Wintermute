- Speicher:
    - Backup-Platte:
        description: Letzter bekannter Stand (nur beim nächtlichen Backup online)
        widget:
          type: customapi
          url: http://192.168.178.37:8091/backup-status.json
          refreshInterval: 300000
          mappings:
            - field: percent
              label: Belegt
              format: text
            - field: used
              label: Benutzt
              format: text
            - field: avail
              label: Frei
              format: text
            - field: updated
              label: Stand
              format: text
