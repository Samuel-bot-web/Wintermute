- Netzwerk:
    - AdGuard:
        href: http://192.168.178.36:3000/
        description: DNS-Werbeblocker
        icon: adguard-home.png
        server: my-docker
        container: adguard
        widget:
          type: adguard
          url: http://192.168.178.36:3000
          username: "{{HOMEPAGE_VAR_ADGUARD_USER}}"
          password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"
          fields: ["queries", "blocked", "filtered", "latency"]

    - Samba:
        href: http://192.168.178.36/
        description: Netzwerkfreigabe
        icon: samba-server.png
        server: my-docker
        container: samba

