services:
  broker:
    image: redis:7
    container_name: paperless-broker
    restart: unless-stopped
    volumes:
      - /mnt/nas6tb/paperless/redisdata:/data

  db:
    image: postgres:16
    container_name: paperless-db
    restart: unless-stopped
    volumes:
      - /mnt/nas6tb/paperless/pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless
    restart: unless-stopped
    depends_on:
      - db
      - broker
    ports:
      - "8010:8000"
    volumes:
      - /mnt/nas6tb/paperless/data:/usr/src/paperless/data
      - /mnt/nas6tb/paperless/media:/usr/src/paperless/media
      - /mnt/nas6tb/paperless/export:/usr/src/paperless/export
      - /mnt/nas6tb/paperless/consume:/usr/src/paperless/consume
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: "${POSTGRES_PASSWORD}"
      PAPERLESS_SECRET_KEY: "${PAPERLESS_SECRET_KEY}"
      PAPERLESS_URL: "${PAPERLESS_URL}"
      PAPERLESS_TIME_ZONE: "${PAPERLESS_TIME_ZONE}"
      PAPERLESS_OCR_LANGUAGE: "${PAPERLESS_OCR_LANGUAGE}"
      PAPERLESS_OCR_LANGUAGES: "${PAPERLESS_OCR_LANGUAGES}"
      PAPERLESS_ADMIN_USER: "${PAPERLESS_ADMIN_USER}"
      PAPERLESS_ADMIN_PASSWORD: "${PAPERLESS_ADMIN_PASSWORD}"
